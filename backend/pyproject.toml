[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapal-backend"
version = "0.1.0"
description = "DataPal Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "langgraph",
    "langchain-openai",
    "pandas",
    "duckdb",
    "pytest",
    "docker",
    "langchain>=1.4.2",
    "langsmith[openai-agents]>=0.13.0",
    "sqlglot>=30.18.0",
    "langchain-mcp-adapters>=0.3.2",
    "fastmcp>=3.4.7",
    "pyarrow>=25.0.1",
    "sqlalchemy[asyncio]>=2.1.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.3",
    "bcrypt<5",
    "psycopg[binary]>=3.3.6",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
preview = false
